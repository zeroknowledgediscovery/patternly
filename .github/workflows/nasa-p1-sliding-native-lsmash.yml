name: NASA P-1 sliding LSmash vs GenESeSS learned projection matrices

on:
  push:
    branches: [data/nasa-smap-msl-telemetry]
    paths: [".github/workflows/nasa-p1-sliding-native-lsmash.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  both-native-matrices:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/nasa-smap-msl-telemetry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Compile native LSmash with learned PFSA binding and install native GenESeSS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ libgsl-dev libboost-all-dev
          python -m pip install "pip==24.0"
          python -m pip install "numpy==1.23.5" "scipy==1.10.1" "pandas==1.5.3" "scikit-learn==1.2.2" "matplotlib==3.7.5" dill
          python -m pip install --only-binary=:all: "zedsuite==0.0.7"
          python -m pip install "lsmash @ git+https://github.com/zeroknowledgediscovery/lsmash.git@83150361e4e9cbaed54a7f06ad65f13ad01de69b"
          python -c "import lsmash; from zedsuite.genesess import GenESeSS; assert hasattr(lsmash,'from_sequences_with_pfsas');print('BOTH_ACTUAL_NATIVE_ENGINES_OK')"
          python -m py_compile experiments/nasa_smap_msl/p1_sliding_lsmash.py
      - name: Test 1 native LSmash original random projector family, stride 5
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "2"
          MPLBACKEND: "Agg"
          PYTHONUNBUFFERED: "1"
        run: |
          python experiments/nasa_smap_msl/p1_sliding_lsmash.py \
            --mode default --channel P-1 --window 212 --stride 5 \
            --out results/nasa_p1_sliding_default
      - name: Test 2 native LSmash core with actual GenESeSS PFSAs
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "2"
          MPLBACKEND: "Agg"
          PYTHONUNBUFFERED: "1"
        run: |
          python experiments/nasa_smap_msl/p1_sliding_lsmash.py \
            --mode genesess --channel P-1 --window 212 --stride 5 \
            --initial-train-length 1024 --epsilons 0.01,0.05,0.1,0.2 \
            --out results/nasa_p1_sliding_genesess
      - name: Validate both genuine native matrices
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          n=None
          for mode in ['default','genesess']:
              p=Path('results/nasa_p1_sliding_'+mode)
              d=np.load(p/'distance_matrix.npy')
              meta=json.loads((p/'metadata.json').read_text())
              assert d.ndim==2 and d.shape[0]==d.shape[1] and d.shape[0]>1500
              assert np.isfinite(d).all() and np.allclose(d,d.T)
              assert (p/'annotated_heatmap.png').is_file()
              assert (p/'anomaly_distance_profile.png').is_file()
              assert (mode=='genesess')==meta['actual_genesess_projectors']
              print('VERIFIED',mode,'N',d.shape[0],
                    'states',[m['n_states'] for m in meta['projection_models']],
                    'median_offdiag',meta['offdiagonal_median'])
          PY
      - name: Upload both annotated native matrices and learned PFSAs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nasa-P1-sliding-native-LSmash-vs-native-GenESeSS-projectors
          path: |
            results/nasa_p1_sliding_default/
            results/nasa_p1_sliding_genesess/
          retention-days: 30
          if-no-files-found: warn
