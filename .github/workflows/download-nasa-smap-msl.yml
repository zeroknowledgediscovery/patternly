name: Fetch NASA SMAP MSL telemetry data

on:
  push:
    branches:
      - data/nasa-smap-msl-telemetry
    paths:
      - ".github/workflows/download-nasa-smap-msl.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-nasa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/nasa-smap-msl-telemetry
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Parquet and Hub dependencies
        run: |
          python -m pip install "numpy==2.3.3" "pandas==2.3.3" "pyarrow==21.0.0" "huggingface_hub==0.35.3"
      - name: Download full real telemetry and validate alignment
        env:
          HF_HUB_DISABLE_XET: "1"
        run: |
          python datasets/nasa_smap_msl/download_validate.py \
            --source "${{ runner.temp }}/smap_msl_full" \
            --output datasets/nasa_smap_msl
      - name: Upload original per-channel Parquet and annotations
        uses: actions/upload-artifact@v4
        with:
          name: nasa-smap-msl-original-parquet-82-channels
          path: |
            ${{ runner.temp }}/smap_msl_full/data/train/*.parquet
            ${{ runner.temp }}/smap_msl_full/data/test/*.parquet
            ${{ runner.temp }}/smap_msl_full/labeled_anomalies.csv
            ${{ runner.temp }}/smap_msl_full/LICENSE.txt
          retention-days: 30
          compression-level: 5
          if-no-files-found: error
      - name: Commit compact lossless telemetry series and labels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f datasets/nasa_smap_msl/values/
          git add datasets/nasa_smap_msl/manifest.json datasets/nasa_smap_msl/SHA256SUMS.tsv datasets/nasa_smap_msl/labeled_anomalies.csv datasets/nasa_smap_msl/LICENSE.txt
          if ! git diff --cached --quiet; then
            git commit -m "Import and verify NASA SMAP/MSL real telemetry streams [skip ci]"
            git fetch origin data/nasa-smap-msl-telemetry
            git rebase origin/data/nasa-smap-msl-telemetry
            git push origin HEAD:data/nasa-smap-msl-telemetry
          fi
